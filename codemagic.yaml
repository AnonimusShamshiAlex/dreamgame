workflows:
  android-workflow:
    name: Dream Live - Android
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      vars:
        GODOT_VERSION: "4.3-stable"
    scripts:
      - name: Godot dvijogini yuklab olish
        script: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

      - name: Export shablonlarini yuklab olish
        script: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}
          curl -sL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}/

      - name: Debug keystore yaratish
        script: |
          keytool -genkey -v -keystore $HOME/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Android SDK yo'lini Godot'ga ko'rsatish
        script: |
          mkdir -p ~/.config/godot
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          JAVA_PATH="${JAVA_HOME}"
          cat > ~/.config/godot/editor_settings-4.3.tres << SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Loyihani import qilish
        script: |
          godot --headless --path . --import

      - name: APK yig'ish
        script: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/DreamLive.apk

    artifacts:
      - build/*.apk

    publishing:
      email:
        recipients:
          - nackroot.uz@gmail.com
        notify:
          success: true
          failure: true
