workflows:
  android-workflow:
    name: Dream Live - Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        GODOT_VERSION: "4.3"
        GODOT_RELEASE: "4.3-stable"
    scripts:
      - name: Загрузка и установка шаблонов экспорта Godot
        script: |
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable
          curl --retry 5 --retry-delay 5 -L -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"

          if ! unzip -t templates.tpz > /dev/null 2>&1; then
            echo "templates.tpz повреждён, повторная загрузка..."
            python3 -c "import urllib.request; urllib.request.urlretrieve('https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz', 'templates.tpz')"
          fi

          unzip templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates templates.tpz
          echo "=== Установленные шаблоны ==="
          ls -la ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable/

      - name: Загрузка консольной версии Godot для macOS
        script: |
          curl --retry 7 --retry-delay 3 -L -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_macos.universal.zip"

          if ! unzip -t godot.zip > /dev/null 2>&1; then
            echo "godot.zip повреждён, повторная загрузка..."
            python3 -c "import urllib.request; urllib.request.urlretrieve('https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_macos.universal.zip', 'godot.zip')"
          fi

          unzip godot.zip
          EXEC_PATH=$(find . -type f -path "*MacOS/Godot" | head -n 1)
          if [ -n "$EXEC_PATH" ]; then
            cp "$EXEC_PATH" ./godot_engine
            chmod +x ./godot_engine

            # Фикс macOS Gatekeeper для M1/M2
            xattr -dr com.apple.quarantine ./godot_engine 2>/dev/null || true
            codesign -s - --force --deep ./godot_engine 2>/dev/null || true

            echo "Godot извлечён и подготовлен."
            ./godot_engine --version || true
          else
            echo "КРИТИЧЕСКАЯ ОШИБКА: Исполняемый файл не найден!"
            exit 1
          fi
          rm -rf Godot.app godot.zip

      - name: Создание debug keystore для Android
        script: |
          mkdir -p $HOME/.android
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)
          fi
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Debug keystore создан."

      - name: Настройка путей Android SDK в Godot
        script: |
          mkdir -p ~/.config/godot
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          JAVA_PATH="${JAVA_HOME}"

          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
          echo "ANDROID_HOME     = $ANDROID_HOME"
          echo "JAVA_HOME        = $JAVA_HOME"

          cat > ~/.config/godot/editor_settings-4.3.tres << SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          echo "Editor settings созданы."

      - name: Импорт проекта
        script: |
          ./godot_engine --headless --path . --import || true
          echo "Импорт завершён."

      - name: Создание директории для сборки
        script: |
          mkdir -p build

      - name: Сборка Android APK (Debug)
        script: |
          echo "=== Пресеты проекта ==="
          grep -E '^\[preset\.|^name=' export_presets.cfg || true
          ./godot_engine --headless --path . --export-debug "Android" build/DreamLive.apk
          echo "=== Результат ==="
          ls -la build/

    artifacts:
      - build/*.apk

    publishing:
      email:
        recipients:
          - nackroot.uz@gmail.com
        notify:
          success: true
          failure: true